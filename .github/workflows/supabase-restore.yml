name: Restore Supabase Database Backup

on:
  workflow_dispatch:
    inputs:
      backup_filename:
        description: 'Name of the backup file in Cloudflare R2 (e.g. supabase-backup-20250101-000000.sql.gz.gpg)'
        required: true
        type: string
      confirm_restore:
        description: 'Type "RESTORE" to confirm you want to overwrite database data'
        required: true
        type: string

jobs:
  restore:
    name: Download and Restore Backup from Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Confirmation Guard
        run: |
          if [ "${{ github.event.inputs.confirm_restore }}" != "RESTORE" ]; then
            echo "Error: Restore confirmation failed. You must type 'RESTORE' into confirm_restore input."
            exit 1
          fi

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Download Backup from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
          BACKUP_FILENAME: ${{ github.event.inputs.backup_filename }}
        run: |
          set -euo pipefail

          if [ -z "${CF_R2_ACCOUNT_ID}" ] || [ -z "${CF_R2_BUCKET_NAME}" ]; then
            echo "Error: Cloudflare R2 secrets are missing."
            exit 1
          fi

          echo "Downloading ${BACKUP_FILENAME} from Cloudflare R2..."
          aws s3 cp "s3://${CF_R2_BUCKET_NAME}/${BACKUP_FILENAME}" "./${BACKUP_FILENAME}" \
            --endpoint-url "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Download completed."

      - name: Decrypt, Uncompress, and Restore Database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          BACKUP_FILENAME: ${{ github.event.inputs.backup_filename }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "Error: SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE}" ]; then
            echo "Error: BACKUP_ENCRYPTION_PASSPHRASE secret is not set."
            exit 1
          fi

          echo "Decrypting backup file..."
          gpg --decrypt --batch --yes --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" "${BACKUP_FILENAME}" > backup.sql.gz

          echo "Uncompressing backup file..."
          gunzip backup.sql.gz

          echo "Restoring SQL database to Supabase..."
          psql "${SUPABASE_DB_URL}" -f backup.sql

          echo "Database restoration completed successfully!"
