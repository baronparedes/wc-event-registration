name: Supabase Database Backup

on:
  schedule:
    # Runs every Sunday at 17:00 UTC (Monday 01:00 AM PHT / UTC+8)
    - cron: '0 17 * * 0'
  workflow_dispatch:

jobs:
  backup:
    name: Backup and Upload to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Perform Database Dump, Compress, and Encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "Error: SUPABASE_DB_URL secret is not set."
            exit 1
          fi

          if [ -z "${BACKUP_ENCRYPTION_PASSPHRASE}" ]; then
            echo "Error: BACKUP_ENCRYPTION_PASSPHRASE secret is not set."
            exit 1
          fi

          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          BACKUP_FILE="supabase-backup-${TIMESTAMP}.sql.gz.gpg"

          echo "Starting Supabase database backup..."
          pg_dump "${SUPABASE_DB_URL}" \
            --clean \
            --if-exists \
            --no-owner \
            --no-privileges \
            | gzip -c \
            | gpg --symmetric --batch --yes --passphrase "${BACKUP_ENCRYPTION_PASSPHRASE}" --cipher-algo AES256 -o "${BACKUP_FILE}"

          echo "Backup created successfully: ${BACKUP_FILE}"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> $GITHUB_ENV

      - name: Upload Backup to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_BUCKET_NAME: ${{ secrets.CF_R2_BUCKET_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${CF_R2_ACCOUNT_ID}" ] || [ -z "${CF_R2_BUCKET_NAME}" ]; then
            echo "Error: Cloudflare R2 bucket configuration secrets are missing."
            exit 1
          fi

          echo "Uploading ${BACKUP_FILE} to Cloudflare R2..."
          aws s3 cp "${BACKUP_FILE}" "s3://${CF_R2_BUCKET_NAME}/${BACKUP_FILE}" \
            --endpoint-url "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Upload complete!"
