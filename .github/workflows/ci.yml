name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_ANON_KEY: sb_test_key
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_key

jobs:
  static-checks:
    name: Static Checks (Format, Lint, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm i -g npm@10.9.2 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Formatting (prettier)
        run: npm run format:check

      - name: Linting (eslint)
        run: npm run lint

      - name: TypeScript & App Build
        run: npm run build:agent

  edge-functions:
    name: Edge Functions (Lint, Check, Test & Coverage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Pin npm
        run: npm i -g npm@10.9.2 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Edge Functions CI
        run: npm run ci:edge

      - name: Upload Edge HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-coverage-html
          path: coverage-edge/html/
          if-no-files-found: warn
          retention-days: 14

  react-tests:
    name: React Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm i -g npm@10.9.2 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: React Unit Tests & Coverage
        run: npm run test:coverage -- --reporter=agent

      - name: Upload React coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Quality Gate
    needs: [static-checks, edge-functions, react-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all quality checks passed
        run: |
          if [ "${{ needs.static-checks.result }}" != "success" ] || \
             [ "${{ needs.edge-functions.result }}" != "success" ] || \
             [ "${{ needs.react-tests.result }}" != "success" ]; then
            echo "❌ One or more quality check jobs failed."
            exit 1
          fi
          echo "✅ All quality check jobs passed successfully!"

  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (JS/TS)
        run: >-
          semgrep
          --config p/javascript
          --config p/typescript
          --error
          --metrics=off
          --jobs 1
          --max-target-bytes 100000
          --exclude "node_modules"
          --exclude "dist"
          --exclude "dev-dist"
          --exclude "coverage*"
          --exclude ".agent*"
          --exclude "*__tests__*"
          --exclude "*.test.*"
          --exclude "*.spec.*"
          --exclude "*.types.ts"
          --exclude "*.d.ts"
          src supabase/functions api scripts

  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm i -g npm@10.9.2 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high
